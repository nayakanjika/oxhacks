<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {# This line makes the site fit a phone screen properly. Keep it. #}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Q-rious{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">

  {# FONT: to change the font, swap "Lexend" in this link AND in --font-main
     at the top of static/style.css. Nothing else needs to change. #}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
